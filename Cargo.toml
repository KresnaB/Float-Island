[package]
name = "float-island"
version = "0.2.1"
edition = "2024"
description = "A lightweight Dynamic Island-style status pill for Windows and Linux: system stats, media, notifications, Claude usage and monitor brightness."
license = "MIT"
repository = "https://github.com/KresnaB/Float-Island"

[[bin]]
name = "FloatIsland"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11"
libloading = "0.8"         # gtk4-layer-shell is loaded at runtime (optional on the user's system)
gdk4-x11 = "0.11"          # GNOME / no layer-shell: runs through XWayland
x11rb = "0.14"
pangocairo = "0.22"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
mpris = "2"
dbus = "0.9"
ureq = "3"
serde_json = "1"
nvml-wrapper = "0.13"      # loads libnvidia-ml at runtime; absent = no NVIDIA GPU stats

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Data_Json",
    "Media_Control",
    "Web_Http",
    "Web_Http_Headers",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
