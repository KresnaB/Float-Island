name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtk4-layer-shell-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Package
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          d="FloatIsland-$v-linux-x86_64"
          mkdir "$d"
          cp target/release/FloatIsland "$d/floatisland"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/floatisland.desktop \
             assets/logo.png README.md LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"
          echo "PKG=$d.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ env.PKG }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
